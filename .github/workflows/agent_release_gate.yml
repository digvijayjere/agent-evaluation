name: Enterprise Agent Evaluation & Release Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      agent_endpoint:
        description: "Target candidate agent endpoint or mock URI (e.g. mock://compliant, mock://regressed)"
        required: true
        default: "mock://compliant"
      suite:
        description: "Evaluation suite to run (expected, degraded, segment, adversarial, all)"
        required: true
        default: "all"
      gate_threshold:
        description: "Maximum allowable metric regression drop (e.g. 0.03 for 3%)"
        required: false
        default: "0.03"

permissions:
  contents: read
  pull-requests: write

jobs:
  agent-evaluation-gate:
    name: Evaluate Candidate Agent & Enforce Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AGENT_ENDPOINT: ${{ github.event.inputs.agent_endpoint || 'mock://compliant' }}
      SUITE: ${{ github.event.inputs.suite || 'all' }}
      GATE_THRESHOLD: ${{ github.event.inputs.gate_threshold || '0.03' }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Golden Dataset Checksum Integrity (P0)
        run: |
          python -m pytest tests/unit/test_phase1_datasets.py -v

      - name: Execute Scoring & Gating Unit Test Suite
        run: |
          python -m pytest tests/unit/ -v

      - name: Run Automated Agent Evaluation with Blocking Release Gate
        id: eval_gate
        run: |
          python -m pytest tests/eval/test_agent_evaluation.py \
            --agent-endpoint="${AGENT_ENDPOINT}" \
            --suite="${SUITE}" \
            --gate \
            --gate-threshold="${GATE_THRESHOLD}" \
            --baseline-metrics="benchmarks/baseline_v1_metrics.json" \
            --langfuse-sync \
            --report-out="reports/eval_report.json" \
            -v

      - name: Publish Release Gate Report to Step Summary
        if: always()
        run: |
          if [ -f "RELEASE_GATE.md" ]; then
            cat RELEASE_GATE.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Gating Reports and Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts
          path: |
            RELEASE_GATE.md
            reports/eval_report.json
          retention-days: 30

      - name: Comment Gating Decision on Pull Request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('RELEASE_GATE.md')) {
              const report = fs.readFileSync('RELEASE_GATE.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }
